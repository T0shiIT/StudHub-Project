events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  upstream backend  { server backend:8080; }
  upstream messenger { server messenger:9000; }

  server {
    listen 80;

    # ---- Static frontend ----
    location / {
      root   /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }

    # ---- Java REST API ----
    location /api/ {
      proxy_pass         http://backend;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---- Go Messenger: WebSocket ----
    location /ws/ {
      proxy_pass             http://messenger;
      proxy_http_version     1.1;
      proxy_set_header       Upgrade    $http_upgrade;
      proxy_set_header       Connection "upgrade";
      proxy_set_header       Host       $host;
      proxy_read_timeout     3600s;
      proxy_send_timeout     3600s;
    }

    # ---- Go Messenger: REST (history, health, dialogs) ----
    # Frontend calls /messenger/... which is stripped to /... before hitting Go.
    location /messenger/ {
      rewrite               ^/messenger/(.*)$ /$1 break;
      proxy_pass            http://messenger;
      proxy_set_header      Host            $host;
      proxy_set_header      X-Real-IP       $remote_addr;
      proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
