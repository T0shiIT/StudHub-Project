events {
    worker_connections 1024;
}
http {
    server {
        listen 80;

        location / {
            proxy_pass http://frontend:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        #Временно комменчу для построения безопасности
        # #роут для C++
        # location /api/cpp/ {
        #     proxy_pass http://cpp:8081;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        # }

        # #Маршрут для тестов/ролей (если он нужен тесту)
        # location /api/test/ {
        #     proxy_pass http://cpp:8081;
        #     proxy_set_header Host $host;
        # }
        
        # Общий API на джаву
        location /api/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}