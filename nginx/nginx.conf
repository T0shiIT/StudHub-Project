events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # Прокси на фронтенд
        location / {
            proxy_pass http://frontend:5173;
            proxy_set_header Host $host;
        }

        # Прокси на бэкенд (API)
        location /api {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
        }
    }
}
