services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: studhub
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  cpp:
    build: ./database
    # ports: закрыт порт от внешнего доступа
    #   - "8081:8081"
    depends_on:
      - db

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      - db
      - cpp
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/studhub
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: pass
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      CPP_SERVICE_URL: http://cpp:8081
      # ===== SMTP =====
      # Поддерживаются Yandex и Mail.ru. Пресеты см. .env.example.
      # Дефолт — Yandex (smtp.yandex.ru:465, SSL).
      MAIL_HOST: ${MAIL_HOST:-smtp.yandex.ru}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-your_login@yandex.ru}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-your_app_password}
      MAIL_FROM: ${MAIL_FROM:-your_login@yandex.ru}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_SSL: ${MAIL_SSL:-true}
      BACKEND_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:5173

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - ./frontend/dist:/usr/share/nginx/html

volumes:
  db_data: