services:

  # TypeScript фронт
  web-client:
    image: nginx:latest
    container_name: web-client
    volumes:
      - ./WebClient/src:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    networks:
      - app-network
    restart: always
    depends_on:
      - authorization
      - core-app  

  # Java авторизация
  authorization:
    build: ./Authorization
    container_name: authorization
    networks:
      - app-network
    restart: always
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET=${JWT_SECRET:-default_secret}
    depends_on:
      - mongo
      - redis
      - core-app

#ВРЕМЕННО ГЛУШИМ МЕЙН
  # Java + C++ Логика
  core-app:
    build: ./AppLogic
    container_name: core-app
    networks:
      - app-network
    restart: always
    ports:
      - "18080:18080"
    environment:
      - POSTGRES_HOST=postgres-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=AppLogic
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    depends_on:
      postgres-db:
        condition: service_healthy

  # Базы данных
  redis:
    image: redis:alpine
    container_name: redis
    networks:
      - app-network
    restart: always
    volumes:
      - redis_volume_data:/data

  mongo:
    image: mongo:latest
    container_name: mongo  # Исправлено: теперь имя совпадает с тем, что ждет authorization
    networks:
      - app-network
    restart: always
    volumes:
      - mongo_data:/data/db

  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: always
    shm_size: 128mb
    ports:
      - "5445:5432"
    networks:
      - app-network
    environment:
      - POSTGRES_DB=AppLogic
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pgdbdata:/var/lib/postgresql/data
      - ./AppLogic/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  app-network:
    driver: bridge

volumes:
  redis_volume_data:
  mongo_data:
  pgdbdata: