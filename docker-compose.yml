services:
  # База данных
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: studhub
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports: ["5432:5432"]
    volumes:
      - db_data:/var/lib/postgresql/data

  # Серверная часть
  backend:
    build: ./backend
    ports: ["8080:8080"]
    depends_on: [db]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/studhub
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: pass

  # Клиентская часть
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]

  # Веб-сервер
  nginx:
    build: ./nginx
    ports: ["80:80"]
    depends_on: [frontend, backend]

volumes:
  db_data: