services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: studhub
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d studhub"]
      interval: 5s
      timeout: 5s
      retries: 5

  cpp:
    build: ./database

    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy # Ждем, пока БД полностью готова
    expose:
      - "8081"
    volumes:
      - ./uploads/schedules:/app/uploads/schedules

  parser:
    build: ./parser
    restart: unless-stopped
    expose:
      - "8000"

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy # Ждем только БД, она точно имеет pg_isready
      cpp:
        condition: service_started
      parser:
        condition: service_started
      redis:
        condition: service_healthy 
    volumes:
      - ./uploads/schedules:/app/uploads/schedules:ro
      - ./uploads:/app/uploads
    environment:
      APP_REGISTER_BYPASS_CODE: admin
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/studhub
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: pass
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      CPP_SERVICE_URL: http://cpp:8081
      PARSER_SERVICE_URL: http://parser:8000
      MAIL_HOST: ${MAIL_HOST:-smtp.yandex.ru}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-your_login@yandex.ru}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-your_app_password}
      MAIL_FROM: ${MAIL_FROM:-your_login@yandex.ru}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_SSL: ${MAIL_SSL:-true}
      BACKEND_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:5173

      # Секрет для верификации JWT в Go — должен совпасть с CHAT_JWT_SECRET
      CHAT_JWT_SECRET: ${CHAT_JWT_SECRET:-changeme-shared-secret}
      
      # Redis configuration
      SPRING_DATA_REDIS_HOST: redis  
      SPRING_DATA_REDIS_PORT: 6379   

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend  #Просто ждем старта контейнера, без condition: service_healthy

  nginx:
    build: ./nginx
    ports:
      - "8082:80"
    depends_on:
      - backend
      - cpp
    volumes:
      # ВНИМАНИЕ: Папка ./frontend/dist должна быть предварительно собрана!
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro


  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  messenger:
    build: ./messenger
    restart: unless-stopped
    ports:
      - "9000:9000"
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      REDIS_ADDR: redis:6379
      JAVA_BACKEND_URL: http://backend:8080
      CHAT_JWT_SECRET: ${CHAT_JWT_SECRET:-changeme-shared-secret}
      CHAT_PORT: "9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  db_data:
