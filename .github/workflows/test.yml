name: CI TEST

on:
  push:
    branches: ["development"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start full stack
        run: docker compose up -d 

      - name: Install dependencies
        run: python -m pip install --upgrade pip
             pip install requests pytest

      - name: Wait for services
        run: sleep 15      

      - name: Run .sh diagnostic
        run: chmod +x ./scripts/test.sh && ./scripts/test.sh

      - name: Run python tests
        run: pytest -s tests/test_auth.py

      - name: Run python tests TEST API
        run:  pytest -s tests/test_project.py
      
      - name: Run python tests AUTHORIZATION TEST
        run: pytest -s tests/tes_auth.py
      
      - name: Stop services 
        if: always()
        run: docker compose down
      