name: CI Tests
 
on:
  push:
    branches: ["development", "main"]
  pull_request:
 
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
 
    env:
      STUDHUB_BASE_URL: http://localhost:8080
      STUDHUB_CHAT_URL: ws://localhost:9000
      STUDHUB_BYPASS:   admin
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      #Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: tests/requirements.txt
 
      - name: Install Python dependencies
        run: pip install -r tests/requirements.txt
 
      #docker env 
      - name: Create .env for Docker
        run: |
          cat > .env <<EOF
          MAIL_HOST=smtp.yandex.ru
          MAIL_PORT=465
          MAIL_USERNAME=noreply@studhub.test
          MAIL_PASSWORD=dummy
          MAIL_FROM=noreply@studhub.test
          MAIL_STARTTLS=false
          MAIL_SSL=true
          CHAT_JWT_SECRET=ci-test-secret-do-not-use-in-prod
          BACKEND_URL=http://localhost:8080
          FRONTEND_URL=http://localhost:5173
          EOF
 
      - name: Build and start full stack
        run: docker compose up -d --build
 
      #аналог sleep 
      - name: Wait for Java backend
        run: |
          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1 || \
               curl -sf http://localhost:8080/api/auth/login \
                    -X POST -H "Content-Type: application/json" \
                    -d '{}' -o /dev/null; then
              echo "Backend is up (attempt $i)"
              break
            fi
            echo "  attempt $i/30..."
            sleep 5
          done
 
      - name: Wait for Go messenger
        run: |
          echo "Waiting for messenger..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:9000/health > /dev/null 2>&1; then
              echo "Messenger is up (attempt $i)"
              break
            fi
            echo "  attempt $i/20..."
            sleep 3
          done
 
      #скрипт диагностики
      - name: Run diagnostic script
        if: hashFiles('scripts/test.sh') != ''
        run: chmod +x ./scripts/test.sh && ./scripts/test.sh
 
      #тесты
      - name: Run all tests
        run: |
          pytest tests/ -v \
            --tb=short \
            -m "not integration" \
            --junit-xml=test-results.xml \
            -p no:warnings
 
      #храним артефакты (файлы с данными)
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
 
      - name: Show docker logs on failure
        if: failure()
        run: |
          echo "=== backend ===" && docker compose logs backend --tail=50
          echo "=== cpp ===" && docker compose logs cpp --tail=30
          echo "=== messenger ===" && docker compose logs messenger --tail=30
          echo "=== db ===" && docker compose logs db --tail=20
 
      #остановка
      - name: Stop services
        if: always()
        run: docker compose down -v