# ================= MAIL (SMTP) =================
# ?????????????? ?????????:
#   Yandex:   host=smtp.yandex.ru, port=465, STARTTLS=false, SSL=true
#   Mail.ru:  host=smtp.mail.ru,   port=465, STARTTLS=false, SSL=true
# ?????? ?????????? ?????? ?????????? (App Password).
spring.mail.host=${MAIL_HOST:smtp.yandex.ru}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:true}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.yandex.ru}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ?????? ??? ?????? ? ?????? ?????????????
app.mail.from=${MAIL_FROM:no-reply@studhub.local}
app.mail.verification-ttl-hours=24

